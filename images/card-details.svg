<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">银行卡资料填写示意图</title>
  <desc id="desc">卡号、有效期、安全码、持卡人姓名和真实账单地址的填写示例，全部为占位符。</desc>
  <rect width="1200" height="790" rx="24" fill="#f8fafc"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="600" y="70" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">银行卡资料填写（全部为占位符）</text>
    <rect x="210" y="115" width="780" height="520" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <g font-size="19" fill="#475569">
      <text x="260" y="175">卡号</text><text x="260" y="285">有效期</text><text x="650" y="285">安全码</text>
      <text x="260" y="395">持卡人姓名</text><text x="260" y="505">真实账单地址</text>
    </g>
    <g fill="#f8fafc" stroke="#94a3b8">
      <rect x="260" y="195" width="680" height="55" rx="9"/><rect x="260" y="305" width="250" height="55" rx="9"/>
      <rect x="650" y="305" width="290" height="55" rx="9"/><rect x="260" y="415" width="680" height="55" rx="9"/>
      <rect x="260" y="525" width="680" height="75" rx="9"/>
    </g>
    <g font-size="20" fill="#94a3b8">
      <text x="285" y="232">•••• •••• •••• ••••</text><text x="285" y="342">MM / YY</text><text x="675" y="342">•••</text>
      <text x="285" y="452">本人银行预留姓名</text><text x="285" y="560">与银行记录一致的真实地址</text>
    </g>
    <rect x="165" y="675" width="870" height="70" rx="15" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="600" y="719" text-anchor="middle" font-size="21" fill="#9a3412">不要公开完整卡号、安全码、验证码或真实账单资料</text>
  </g>
</svg>
