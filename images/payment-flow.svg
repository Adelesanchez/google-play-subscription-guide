<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Google Play 正规订阅流程</title>
  <desc id="desc">确认银行卡、添加付款方式、填写真实资料、核对订阅、管理续费。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 0 6 9 3Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#f8fafc"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="600" y="58" font-size="30" font-weight="600" fill="#0f172a">Google Play 正规订阅流程</text>
    <g font-size="21" font-weight="600" fill="#0f172a">
      <rect x="45" y="125" width="190" height="125" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="140" y="180">确认银行卡</text><text x="140" y="215" font-size="16" font-weight="400" fill="#475569">国际线上与续费</text>
      <rect x="275" y="125" width="190" height="125" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="370" y="180">添加付款方式</text><text x="370" y="215" font-size="16" font-weight="400" fill="#475569">Google 付款中心</text>
      <rect x="505" y="125" width="190" height="125" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
      <text x="600" y="180">填写真实资料</text><text x="600" y="215" font-size="16" font-weight="400" fill="#475569">本人卡片与账单</text>
      <rect x="735" y="125" width="190" height="125" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="830" y="180">核对并订阅</text><text x="830" y="215" font-size="16" font-weight="400" fill="#475569">价格、税费、周期</text>
      <rect x="965" y="125" width="190" height="125" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
      <text x="1060" y="180">管理自动续费</text><text x="1060" y="215" font-size="16" font-weight="400" fill="#475569">Google Play 订阅</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M235 188H275"/><path d="M465 188H505"/><path d="M695 188H735"/><path d="M925 188H965"/>
    </g>
    <text x="600" y="325" font-size="20" fill="#475569">不使用虚假地址，不规避地区限制，以官方结算页面为准</text>
  </g>
</svg>
