<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">应用内订阅与管理示意图</title>
  <desc id="desc">左侧为核对价格、税费、续费周期后订阅，右侧为通过 Google Play 管理和取消订阅。</desc>
  <rect width="1200" height="760" rx="24" fill="#f1f5f9"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="300" y="65" text-anchor="middle" font-size="28" font-weight="600" fill="#0f172a">订阅前核对</text>
    <text x="900" y="65" text-anchor="middle" font-size="28" font-weight="600" fill="#0f172a">管理与取消</text>
    <rect x="120" y="105" width="360" height="580" rx="36" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <rect x="720" y="105" width="360" height="580" rx="36" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="300" y="170" text-anchor="middle" font-size="25" font-weight="600" fill="#1e293b">应用订阅示例</text>
    <g font-size="20" fill="#475569">
      <text x="165" y="235">订阅档位</text><text x="165" y="295">结算价格</text><text x="165" y="355">税费与币种</text><text x="165" y="415">自动续费</text><text x="165" y="475">付款方式</text>
    </g>
    <g font-size="20" text-anchor="end" fill="#0f172a">
      <text x="435" y="235">以页面为准</text><text x="435" y="295">以页面为准</text><text x="435" y="355">结算前核对</text><text x="435" y="415">查看续费日期</text><text x="435" y="475">Google Play</text>
    </g>
    <rect x="165" y="540" width="270" height="70" rx="14" fill="#2563eb"/>
    <text x="300" y="584" text-anchor="middle" font-size="23" font-weight="600" fill="#ffffff">确认后订阅</text>
    <text x="900" y="180" text-anchor="middle" font-size="24" font-weight="600" fill="#1e293b">Google Play</text>
    <rect x="765" y="225" width="270" height="58" rx="12" fill="#f1f5f9"/>
    <text x="900" y="263" text-anchor="middle" font-size="20" fill="#334155">账号头像</text>
    <rect x="765" y="310" width="270" height="58" rx="12" fill="#f1f5f9"/>
    <text x="900" y="348" text-anchor="middle" font-size="20" fill="#334155">付款和订阅</text>
    <rect x="765" y="395" width="270" height="58" rx="12" fill="#f1f5f9"/>
    <text x="900" y="433" text-anchor="middle" font-size="20" fill="#334155">订阅</text>
    <rect x="765" y="500" width="270" height="70" rx="14" fill="#fee2e2"/>
    <text x="900" y="544" text-anchor="middle" font-size="21" fill="#b91c1c">选择服务并管理续费</text>
    <text x="900" y="625" text-anchor="middle" font-size="18" fill="#64748b">卸载应用不等于取消订阅</text>
  </g>
</svg>
